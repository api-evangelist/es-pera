name: ES·pera API
description: Spanish-language open-data project comparing Spanish National Health System (SNS) healthcare waiting
  lists across autonomous communities, specialties and procedures. Publishes free machine-readable open-data files
  (CSV and static JSON), but exposes no documented REST/GraphQL API, no MCP server, and no confirmable llms.txt
  or agent skills.
