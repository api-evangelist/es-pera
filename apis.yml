name: ES·pera API
description: >-
  ES·pera is an independent Spanish-language observatory that gathers scattered official
  Spanish National Health System (SNS) and autonomous-community publications on healthcare
  waiting lists and hospital activity, and republishes them as comparable, provenance-preserving
  open data. It exposes a free, open, unauthenticated read-only REST API (OpenAPI 3.1 at
  /api/v1) covering hospital entities, national activity metrics and autonomous waiting-list
  observations, served from immutable content-addressed data releases. Discovery is via an
  RFC 9727 API catalog, an llms.txt, and a provider-published Agent Skill; there is no MCP
  server, no A2A agent card, and no client SDK.
